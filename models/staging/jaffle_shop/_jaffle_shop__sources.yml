version: 2

sources:
  - name: jaffle_shop
    description: a clone of Postgres application database 
    database: raw
    schema: jaffle_shop
    freshness:  # make this a little more strict
      warn_after: {count: 6, period: hour}
      error_after: {count: 1, period: day}
    loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: raw database data
        columns:
          - name: customer_id
            description: primary key for customer data
        freshness: null
      - name: orders
        description: raw database data
        